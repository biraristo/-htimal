name: Açık veri derlemesi
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/*.py'
      - '.github/workflows/atlas.yml'
permissions:
  contents: write
concurrency:
  group: ihtimal-data
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/collect.py
      - name: Kataloğu ve verileri yayımla
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data
          if ! git diff --cached --quiet; then
            git commit -m "Resmî kaynaklardan veri arşivini güncelle"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
